name: .NET Desktop Release

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload the build artifact to (for example, v8.0.18)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: x86
            rid: win-x86
            target_framework: net10.0-windows
            artifact_name: xdm-windows-x86
          - os: ubuntu-latest
            platform: x64
            rid: linux-x64
            target_framework: net10.0
            artifact_name: xdm-linux-x64

    env:
      DOTNET_VERSION: 10.0.x
      CONFIGURATION: Release
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Suppress GitHub Actions Warning Annotations
      shell: bash
      run: |
        # Disable GitHub Actions problem matchers to prevent yellow warning boxes on workflow pages
        echo "::remove-matcher owner=csc::"
        echo "::remove-matcher owner=msbuild::"
        echo "::remove-matcher owner=dotnet::"

    - name: Parse Version Definition
      id: parse_version
      shell: bash
      run: |
        # Dynamically extract APP_VERSION from AppInfo.cs as the default single source of truth
        VERSION=$(sed -n 's/.*APP_VERSION.*=.*"\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' app/XDM/XDM.Core/AppInfo.cs | head -n 1)
        if [ -z "$VERSION" ]; then
          VERSION="8.0.26"
        fi
        if [[ "${{ env.RELEASE_TAG }}" =~ v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
          VERSION="${BASH_REMATCH[1]}"
        fi
        echo "BUILD_VER=${VERSION}" >> $GITHUB_ENV

    - name: Build Windows Installer (MSI) via make-msi.bat
      if: matrix.os == 'windows-latest'
      shell: cmd
      env:
        BUILD_VER: ${{ env.BUILD_VER }}
      run: |
        :: Locate WiX Toolset on the runner environment
        set "WIX_PATH=C:\Program Files (x86)\WiX Toolset v3.11\bin"
        if not exist "%WIX_PATH%" set "WIX_PATH=C:\Program Files (x86)\WiX Toolset v3.14\bin"
        if not exist "%WIX_PATH%" (
            echo Error: WiX Toolset could not be located on this runner.
            exit /b 1
        )
        set "PATH=%WIX_PATH%;%PATH%"

        :: Navigate directly to the installer folder where make-msi.bat is located
        cd app\XDM\XDM.Win.Installer

        :: Extract blobs.zip containing ffmpeg-x86.exe and youtube-dl.exe
        if exist blobs.zip (
            powershell -Command "Expand-Archive -Path blobs.zip -DestinationPath . -Force"
        )

        :: Copy extracted executables to the BIN folder before running the .bat script
        if not exist BIN mkdir BIN
        if exist ffmpeg-x86.exe copy /B /Y ffmpeg-x86.exe BIN\
        if exist youtube-dl.exe copy /B /Y youtube-dl.exe BIN\

        :: Ensure fallback placeholders exist to prevent linker errors if missing from repo
        if not exist icon.ico echo. > icon.ico
        if not exist gpl-3.0.rtf echo GNU GPL v3 Placeholder > gpl-3.0.rtf
        if not exist ffmpeg-x86.exe echo. > ffmpeg-x86.exe
        if not exist youtube-dl.exe echo. > youtube-dl.exe

        :: Inject self-contained flags, disable debug symbols, and mute all compiler warnings (WarningLevel=0)
        powershell -Command "if (Test-Path make-msi.bat) { (Get-Content make-msi.bat) -replace 'dotnet publish', 'dotnet publish --self-contained true -r win-x86 -p:PublishTrimmed=false -p:DebugSymbols=false -p:DebugType=None -p:WarningLevel=0 -p:RunAnalyzers=false' | Set-Content make-msi.bat }"

        :: Execute the standalone packaging script
        call make-msi.bat

        :: Delete any remaining debug symbol files (.pdb) before final artifact staging
        if exist BIN del /s /q BIN\*.pdb 2>nul

        :: Copy generated output asset to global artifact staging area
        mkdir ..\..\..\artifacts 2>nul
        copy xdmsetup-%BUILD_VER%-x86.msi ..\..\..\artifacts\

    - name: Build Linux Application & Extensions via make-pkg
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      env:
        BUILD_VER: ${{ env.BUILD_VER }}
      run: |
        cd app/XDM/XDM.Linux.Installer

        # Check if a native bash version of make-pkg exists; update framework, self-contained, symbol, and warning flags
        if [ -f "make-pkg" ]; then
          echo "Found make-pkg script. Updating target framework to net10.0, self-contained, and warning mute flags..."
          sed -i 's/net[0-9]\+\.[0-9]\+/net10.0/g' make-pkg
          sed -i 's/dotnet publish/dotnet publish --self-contained true -p:PublishTrimmed=false -p:DebugSymbols=false -p:DebugType=None -p:WarningLevel=0 -p:RunAnalyzers=false/g' make-pkg
          chmod +x make-pkg
          ./make-pkg
        elif [ -f "make-pkg.sh" ]; then
          echo "Found make-pkg.sh script. Updating target framework to net10.0, self-contained, and warning mute flags..."
          sed -i 's/net[0-9]\+\.[0-9]\+/net10.0/g' make-pkg.sh
          sed -i 's/dotnet publish/dotnet publish --self-contained true -p:PublishTrimmed=false -p:DebugSymbols=false -p:DebugType=None -p:WarningLevel=0 -p:RunAnalyzers=false/g' make-pkg.sh
          chmod +x make-pkg.sh
          ./make-pkg.sh
        else
          echo "Executing native bash equivalent of make-pkg.bat adapted for net10.0..."
          rm -rf BIN xdm-helper-chrome binary-source
          mkdir -p BIN BIN/chrome-extension BIN/ext-loader BIN/XDM.App.Host

          dotnet publish -c Release -f net10.0 -r linux-x64 --self-contained true -p:PublishTrimmed=false -p:DebugSymbols=false -p:DebugType=None -p:WarningLevel=0 -p:RunAnalyzers=false ../XDM.Gtk.UI/XDM.Gtk.UI.csproj -o BIN
          dotnet publish -c Release -f net10.0 -r linux-x64 --self-contained true -p:PublishTrimmed=false -p:DebugSymbols=false -p:DebugType=None -p:WarningLevel=0 -p:RunAnalyzers=false ../XDM.App.Host/XDM.App.Host.csproj -o BIN/XDM.App.Host

          git clone https://github.com/subhra74/xdm-helper-chrome.git
          cp -r xdm-helper-chrome/chrome/chrome-extension/. BIN/chrome-extension/
          cp -r xdm-helper-chrome/ext-loader/. BIN/ext-loader/
        fi

        # Bundle ffmpeg dependency into BIN so it is packaged directly into the debian package
        if [ -f "/usr/bin/ffmpeg" ]; then
          cp -L /usr/bin/ffmpeg BIN/ || true
        fi
        if [ -f "blobs.zip" ]; then
          unzip -o blobs.zip -d . 2>/dev/null || true
          if [ -f "ffmpeg" ]; then cp -f ffmpeg BIN/; fi
          if [ -f "youtube-dl" ]; then cp -f youtube-dl BIN/; fi
        fi

        # Safely remove .pdb symbol files and strip ONLY native C/C++ binaries without touching .dll assemblies
        find BIN -name "*.pdb" -type f -delete 2>/dev/null || true
        find BIN -type f ! -name "*.dll" ! -name "*.exe" \( -name "*.so" -o -name "ffmpeg" -o -name "youtube-dl" -o -name "createdump" \) -exec strip --strip-unneeded {} + 2>/dev/null || true

        # Bridge output to binary-source directory as expected by make-deb-pkg
        rm -rf binary-source
        cp -r BIN binary-source

    - name: Package Linux Debian (.deb) via make-deb-pkg
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      env:
        BUILD_VER: ${{ env.BUILD_VER }}
      run: |
        cd app/XDM/XDM.Linux.Installer

        # Ensure make-deb-pkg is executable and inject dynamic CI build version reliably
        if [ -f "make-deb-pkg" ]; then
          chmod +x make-deb-pkg
          sed -i "s/VERSION=[0-9]\+\.[0-9]\+\.[0-9]\+/VERSION=${BUILD_VER}/g" make-deb-pkg
          sed -i "s/^VERSION=.*/VERSION=${BUILD_VER}/g" make-deb-pkg
          export VERSION="${BUILD_VER}"
          ./make-deb-pkg
        else
          echo "Error: make-deb-pkg script not found in app/XDM/XDM.Linux.Installer!"
          exit 1
        fi

        # Copy generated Debian package to the global artifacts staging directory
        mkdir -p ../../../artifacts 2>/dev/null || true
        cp *.deb ../../../artifacts/

    - name: Upload Runner Workflow Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}-artifacts
        path: |
          artifacts/*.msi
          artifacts/*.deb
        if-no-files-found: warn

  release:
    name: Publish Release Deliverables
    needs: [build]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.0

    - name: Download All Build Artifacts
      uses: actions/download-artifact@v4.1.8
      with:
        path: artifacts
        merge-multiple: true

    - name: Upload Release Deliverables
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        echo "Publishing deliverables to release: ${{ env.RELEASE_TAG }}"
        for file in artifacts/*.msi artifacts/*.deb; do
          if [ -f "$file" ]; then
            echo "Uploading $file..."
            gh release upload "${{ env.RELEASE_TAG }}" "$file" --repo "${{ github.repository }}" --clobber
          fi
        done