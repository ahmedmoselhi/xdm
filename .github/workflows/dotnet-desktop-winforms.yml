name: .NET Desktop Release

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload the build artifact to (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows desktop artifact
    runs-on: windows-latest
    env:
      DOTNET_VERSION: 10.0.x
      PROJECT_PATH: app\XDM\XDM.Wpf.UI\XDM.Wpf.UI.csproj
      HOST_PROJECT_PATH: app\XDM\XDM.App.Host\XDM.App.Host.csproj  # <-- Added Host path
      UNIT_TEST_PROJECT_PATH: app\XDM\XDM.Tests\XDM.Tests.csproj
      SYSTEM_TEST_PROJECT_PATH: app\XDM\XDM_Tests\XDM.SystemTests.csproj
      TARGET_FRAMEWORK: net10.0-windows
      CONFIGURATION: Release
      PLATFORM: x86
      ARTIFACT_NAME: xdm-windows-x86
      PUBLISH_DIR: artifacts\xdm-windows-x86
      ZIP_PATH: artifacts\xdm-windows-x86.zip
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore Main and Host Projects
      run: |
        dotnet restore $env:PROJECT_PATH -p:Platform=$env:PLATFORM -p:TargetFramework=$env:TARGET_FRAMEWORK -p:RuntimeIdentifier=win-x86
        dotnet restore $env:HOST_PROJECT_PATH -p:Platform=$env:PLATFORM -p:TargetFramework=$env:TARGET_FRAMEWORK -p:RuntimeIdentifier=win-x86

    - name: Build Main and Host Projects
      run: |
        dotnet build $env:PROJECT_PATH --configuration $env:CONFIGURATION --framework $env:TARGET_FRAMEWORK --no-restore -p:Platform=$env:PLATFORM -p:EnableWindowsTargeting=true
        dotnet build $env:HOST_PROJECT_PATH --configuration $env:CONFIGURATION --framework $env:TARGET_FRAMEWORK --no-restore -p:Platform=$env:PLATFORM -p:EnableWindowsTargeting=true

    - name: Test unit project
      run: >-
        dotnet test $env:UNIT_TEST_PROJECT_PATH --configuration $env:CONFIGURATION --no-build -p:Platform=$env:PLATFORM --logger "console;verbosity=normal"

    - name: Test system project
      run: >-
        dotnet test $env:SYSTEM_TEST_PROJECT_PATH --configuration $env:CONFIGURATION --no-build -p:Platform=$env:PLATFORM --logger "console;verbosity=normal"

    - name: Publish Main Application
      run: >-
        dotnet publish $env:PROJECT_PATH --configuration $env:CONFIGURATION --framework $env:TARGET_FRAMEWORK --output $env:PUBLISH_DIR -r win-x86 --no-self-contained --no-restore -p:Platform=$env:PLATFORM -p:EnableWindowsTargeting=true

    - name: Publish Native App Host Component
      run: >-
        dotnet publish $env:HOST_PROJECT_PATH --configuration $env:CONFIGURATION --framework $env:TARGET_FRAMEWORK --output "$env:PUBLISH_DIR\XDM.App.Host" -r win-x86 --self-contained true --no-restore -p:Platform=$env:PLATFORM -p:EnableWindowsTargeting=true

    - name: Package artifact
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path (Split-Path $env:ZIP_PATH) | Out-Null
        if (Test-Path $env:ZIP_PATH) { Remove-Item $env:ZIP_PATH -Force }
        Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath $env:ZIP_PATH

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4.4.0
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.ZIP_PATH }}
        if-no-files-found: error

    - name: Upload artifact to release
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload $env:RELEASE_TAG $env:ZIP_PATH --clobber
